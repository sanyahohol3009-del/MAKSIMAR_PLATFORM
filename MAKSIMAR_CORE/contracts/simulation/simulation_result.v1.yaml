contract_name: simulation_result
request_id: simulation_result
schema_version: simulation_result.v1
description: Canonical result contract for one concrete simulation run.

required:
  - request_id
  - run_id
  - started_at
  - finished_at
  - status
  - success
  - primary_outcome

fields:
  request_id:
    type: string
    description: Parent simulation request identifier.

  run_id:
    type: string
    description: Unique simulation run identifier.

  started_at:
    type: string
    format: date-time
    description: UTC timestamp when the run started.

  finished_at:
    type: string
    format: date-time
    description: UTC timestamp when the run finished.

  status:
    type: string
    enum:
      - pending
      - running
      - done
      - failed
      - aborted
      - timeout
      - invalid_request
    description: Final or current simulation run state.

  success:
    type: boolean
    description: High-level success flag for the run.

  primary_outcome:
    type: string
    enum:
      - goal_reached
      - timeout
      - fell_down
      - collision
      - constraint_exceeded
      - sim_error
      - invalid_model
      - unstable_control
      - aborted_by_policy
    description: Primary interpreted outcome of the run.

  summary:
    type: object
    description: Short normalized run summary.
    properties:
      score:
        type: number
      rank_hint:
        type: string
      notes:
        type: string
      recommendation:
        type: string

  raw_metrics:
    type: object
    additional_properties: true
    description: Numeric metrics produced by the run.

  constraint_report:
    type: object
    description: Constraint violation summary.
    properties:
      violated:
        type: boolean
      violations:
        type: array
        items:
          type: object
          required:
            - constraint_name
            - observed_value
            - allowed_value
            - severity
          properties:
            constraint_name:
              type: string
            observed_value:
              type: number
            allowed_value:
              type: number
            severity:
              type: string
              enum:
                - low
                - medium
                - high
                - critical
            timestamp_sec:
              type: number

  failure_report:
    type: object
    description: Structured failure information when run did not succeed.
    properties:
      failure_type:
        type: string
      first_failure:
        type: string
      cascade_failures:
        type: array
        items:
          type: string
      sim_trace_ref:
        type: string
      debug_hint:
        type: string

  artifacts:
    type: object
    description: Artifact references generated by simulation.
    properties:
      log_path:
        type: string
      metrics_path:
        type: string
      trace_path:
        type: string
      video_path:
        type: string
      snapshot_path:
        type: string

  environment_fingerprint:
    type: object
    description: Environment signature used for reproducibility.
    properties:
      environment_id:
        type: string
      environment_hash:
        type: string
      simulator_backend:
        type: string
      simulator_version:
        type: string

  candidate_fingerprint:
    type: object
    description: Candidate signature used during run.
    properties:
      candidate_id:
        type: string
      artifact_hash:
        type: string
      controller_format:
        type: string

validation_rules:
  - run_id must be unique
  - if status=done then raw_metrics should be present
  - if success=false then primary_outcome must not be goal_reached
  - if constraint_report.violated=true then violations must be non-empty
  - artifact paths must remain inside allowed simulation areas

security_rules:
  - result is evidence only
  - result does not grant deploy authority
  - artifact paths must remain inside sandbox or artifact areas
  - backend output must be normalized before leaving simulation layer
